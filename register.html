<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ثبت‌نام پنل گیم‌نت</title>

  <style>
    body {
      font-family: B Nazanin, sans-serif;
      direction: rtl;
      text-align: center;
      margin-top: 80px;
      background: #121212;
      color: #eaeaea;
    }

    .box {
      display: inline-block;
      background: linear-gradient(135deg, #1e1e1e, #252525);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      min-width: 330px;
      transition: 0.3s;
    }

    .box:hover {
      transform: scale(1.02);
    }

    h2 {
      margin-bottom: 25px;
      color: #00eaff;
      font-size: 28px;
    }

    input {
      padding: 12px;
      width: 260px;
      margin: 12px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #2a2a2a;
      color: #eaeaea;
      transition: 0.2s;
    }

    input:focus {
      background: #333;
      box-shadow: 0 0 10px #00eaff;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      margin: 8px;
      transition: 0.2s;
    }

    #registerBtn {
      background: #2196f3;
      color: white;
    }

    #registerBtn:hover {
      background: #1e88e5;
    }

    #goLogin {
      background: #4caf50;
      color: white;
    }

    #goLogin:hover {
      background: #45a049;
    }

    #error {
      color: #ff6b6b;
      margin-top: 10px;
      min-height: 20px;
      font-size: 16px;
    }

    #loading {
      display: none;
      margin-top: 15px;
      font-size: 18px;
      color: #00eaff;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #00eaff;
      border-top-color: transparent;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>ثبت‌نام</h2>

    <input id="username" type="text" placeholder="یوزرنیم">
    <br>
    <input id="password" type="password" placeholder="پسورد">
    <br>
    <input id="confirmPassword" type="password" placeholder="تایید پسورد">
    <br>

    <button id="registerBtn">ثبت‌نام</button>
    <button id="goLogin">بازگشت به ورود</button>

    <div id="loading">
      <div class="spinner"></div>
      <p>در حال انجام عملیات...</p>
    </div>

    <p id="error"></p>
  </div>

  <script>
    const BASE_URL = "https://gamenet-server-mongo.onrender.com";

    const registerBtn = document.getElementById("registerBtn");
    const goLogin = document.getElementById("goLogin");
    const errorEl = document.getElementById("error");
    const loadingEl = document.getElementById("loading");

    function showLoading() {
      loadingEl.style.display = "block";
      registerBtn.disabled = true;
      goLogin.disabled = true;
    }

    function hideLoading() {
      loadingEl.style.display = "none";
      registerBtn.disabled = false;
      goLogin.disabled = false;
    }

    registerBtn.onclick = async () => {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  errorEl.textContent = "";

  if (!username || !password || !confirmPassword) {
    errorEl.textContent = "تمام فیلدها را وارد کنید.";
    return;
  }

  // جلوگیری از فاصله در یوزرنیم
  if (username.includes(" ")) {
    errorEl.textContent = "یوزرنیم نباید شامل فاصله باشد.";
    return;
  }

  if (password !== confirmPassword) {
    errorEl.textContent = "پسورد و تایید پسورد یکسان نیستند.";
    return;
  }

  showLoading();


      // چک وجود کاربر
      try {
        const checkRes = await fetch(`${BASE_URL}/check/${username}`);
        const checkData = await checkRes.json();

        if (checkData.exists) {
          hideLoading();
          errorEl.textContent = "این یوزرنیم قبلاً ثبت شده است.";
          return;
        }
      } catch {
        hideLoading();
        errorEl.textContent = "خطا در ارتباط با سرور.";
        return;
      }

      // ساخت کاربر جدید
      try {
        const res = await fetch(`${BASE_URL}/status/${username}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            systems: {},
            lastUpdate: new Date().toISOString()
          })
        });

        const data = await res.json();

        if (data.ok) {
          localStorage.setItem("username", username);
          localStorage.setItem("password", password);
          window.location.href = "dashboard.html";
        } else {
          errorEl.textContent = "خطا در ثبت‌نام.";
        }
      } catch {
        errorEl.textContent = "خطا در ارتباط با سرور.";
      }

      hideLoading();
    };

    goLogin.onclick = () => {
      window.location.href = "login.html";
    };
  </script>

</body>
</html>
