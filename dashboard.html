<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>داشبورد گیم‌نت</title>

  <style>
    body {
      background: #121212;
      color: #eaeaea;
      direction: rtl;
      margin: 0;
      font-family: Vazirmatn, sans-serif;
    }

    /* ساختار کلی */
    .layout {
      display: flex;
      height: 100vh;
    }

    /* منوی سه‌خطی */
    .hamburger {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #1e1e1e;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 0 10px #000;
    }

    .hamburger div {
      width: 30px;
      height: 4px;
      background: #00eaff;
      margin: 5px 0;
      border-radius: 5px;
      transition: 0.3s;
    }

    /* منوی مخفی */
    .sidebar {
      position: fixed;
      right: -320px;
      top: 0;
      width: 300px;
      height: 100%;
      background: #1e1e1e;
      padding: 25px;
      box-shadow: 0 0 20px #000;
      transition: 0.4s;
      z-index: 999;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar h2 {
      font-size: 40px;
      color: #00eaff;
      margin-bottom: 30px;
      text-align: center;
    }

    .menu-item {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 32px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .menu-item:hover {
      background: #00eaff;
      color: #000;
      transform: scale(1.03);
    }

    /* داشبورد */
    .dashboard {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      font-size: 40px;
      font-weight: bold;
      color: #fff;
    }

    .expire-date {
      color: #ff4444;
    }

    /* هشدار اشتراک */
    .sub-warning {
      background: #2a2a2a;
      padding: 40px;
      border-radius: 20px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 0 15px #000;
    }

    .sub-warning h2 {
      color: #ff4444;
      font-size: 55px;
      margin-bottom: 20px;
    }

    .sub-warning p {
      font-size: 40px;
      margin: 10px 0;
    }

    .sub-warning .phone {
      font-size: 50px;
      color: #00eaff;
      font-weight: bold;
    }

    /* سیستم‌ها */
    .systems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 25px;
    }

    .card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 18px;
      color: #fff;
      font-size: 35px;
      box-shadow: 0 0 15px #000;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card.active {
      border-left: 10px solid #00ff6a;
    }

    .card.free {
      border-left: 10px solid #ff4444;
    }

    /* مودال */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      padding: 40px;
      overflow-y: auto;
      z-index: 2000;
    }

    .modal-content {
      background: #222;
      padding: 40px;
      border-radius: 25px;
      color: #fff;
      font-size: 40px;
      line-height: 1.8;
    }

    .modal-close {
      margin-top: 30px;
      padding: 20px 40px;
      font-size: 40px;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 15px;
    }

    .modal-total-snacks {
      font-size: 55px;
      margin-top: 40px;
      margin-bottom: 40px;
      color: #00eaff;
      font-weight: bold;
    }

    .modal-final-total {
      font-size: 70px;
      margin-top: 50px;
      margin-bottom: 50px;
      color: #00ff6a;
      font-weight: bold;
      display: block;
    }

    .snack-item {
      display: flex;
      justify-content: space-between;
      font-size: 40px;
      margin: 10px 0;
    }

    .customer-box {
      background: #333;
      padding: 25px;
      border-radius: 15px;
      margin-top: 20px;
      font-size: 40px;
    }
  </style>
</head>

<body>

<!-- دکمه سه‌خط -->

  <div></div>

  <div></div>

          <p>برای تمدید اشتراک با پشتیبانی تماس بگیرید:</p>
          <p class="phone">09187343793</p>
      </div>

      <div id="systems" class="systems-grid"></div>

  </div>

</div>

<!-- مودال -->
<div id="modal" class="modal">

</div>
