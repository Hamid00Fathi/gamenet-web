<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>داشبورد گیم‌نت</title>
  <style>
    .dashboard {
        padding: 20px;
        font-family: Vazirmatn, sans-serif;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 25px;
        font-size: 40px;
        font-weight: bold;
        color: #fff;
    }

    .expire-date {
        color: #ff4444;
    }

    .sub-warning {
        background: #2a2a2a;
        padding: 40px;
        border-radius: 20px;
        margin-bottom: 30px;
        text-align: center;
        box-shadow: 0 0 15px #000;
    }

    .sub-warning h2 {
        color: #ff4444;
        font-size: 55px;
        margin-bottom: 20px;
    }

    .sub-warning p {
        font-size: 40px;
        margin: 10px 0;
    }

    .sub-warning .phone {
        font-size: 50px;
        color: #00eaff;
        font-weight: bold;
    }

    .systems-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 25px;
    }

    .card {
        background: #1e1e1e;
        padding: 25px;
        border-radius: 18px;
        color: #fff;
        font-size: 35px;
        box-shadow: 0 0 15px #000;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card.active {
        border-left: 10px solid #00ff6a;
    }

    .card.free {
        border-left: 10px solid #ff4444;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        padding: 40px;
        overflow-y: auto;
    }

    .modal-content {
        background: #222;
        padding: 40px;
        border-radius: 25px;
        color: #fff;
        font-size: 40px;
        line-height: 1.8;
    }

    .modal-close {
        margin-top: 30px;
        padding: 20px 40px;
        font-size: 40px;
        background: #ff4444;
        color: #fff;
        border: none;
        border-radius: 15px;
    }

    .modal-total-snacks {
        font-size: 55px;
        margin-top: 40px;
        margin-bottom: 40px;
        color: #00eaff;
        font-weight: bold;
    }

    .modal-final-total {
        font-size: 70px;
        margin-top: 50px;
        margin-bottom: 50px;
        color: #00ff6a;
        font-weight: bold;
        display: block;
    }

    .snack-item {
        display: flex;
        justify-content: space-between;
        font-size: 40px;
        margin: 10px 0;
    }

    .customer-box {
        background: #333;
        padding: 25px;
        border-radius: 15px;
        margin-top: 20px;
        font-size: 40px;
    }

    body {
        background: #121212;
        color: #eaeaea;
        direction: rtl;
    }
  </style>
</head>
<body>

<div id="dashboard" class="dashboard">

    <header class="topbar">
        <div id="panelUsername" class="username"></div>
        <div id="expireDate" class="expire-date"></div>
        <div id="lastUpdate" class="last-update"></div>
    </header>

    <div id="subscriptionWarning" class="sub-warning" style="display:none;">
        <h2>اشتراک شما منقضی شده است</h2>
        <p>برای ادامه استفاده از پنل، باید اشتراک خود را تمدید کنید.</p>
        <p>برای تمدید اشتراک با پشتیبانی تماس بگیرید:</p>
        <p class="phone">09187343793</p>
    </div>

    <div id="systems" class="systems-grid"></div>

</div>

<div id="modal" class="modal">
    <div class="modal-content" id="modalContent"></div>
    <button id="closeModal" class="modal-close">بستن</button>
</div>

<div id="loading" class="loading">در حال بارگذاری...</div>

<script>
const BASE_URL = "https://gamenet-server-mongo.onrender.com";

async function loadStatus() {
    const username = localStorage.getItem("username");
    const password = localStorage.getItem("password");

    const panelUsernameEl = document.getElementById("panelUsername");
    const expireDateEl = document.getElementById("expireDate");
    const lastUpdateEl = document.getElementById("lastUpdate");
    const warningBox = document.getElementById("subscriptionWarning");

    panelUsernameEl.innerText = "نام کاربری: " + (username || "—");

    try {
        const subRes = await fetch(`${BASE_URL}/subscription/${username}`);
        const subData = await subRes.json();

        expireDateEl.innerText = "تاریخ انقضا: " + (subData.expireDate || "—");

        if (!subData.active) {
            warningBox.style.display = "block";
            document.getElementById("systems").innerHTML = "";
            lastUpdateEl.innerText = "آخرین آپدیت: —";
            return;
        } else {
            warningBox.style.display = "none";
        }
    } catch (e) {
        console.log("خطا در چک اشتراک:", e);
    }

    try {
        const res = await fetch(
            `${BASE_URL}/status/${username}?t=${Date.now()}`,
            { cache: "no-store" }
        );

        const data = await res.json();

        lastUpdateEl.innerText = "آخرین آپدیت: " + (data.lastUpdate || "—");

        if (!data.systems || Object.keys(data.systems).length === 0) {
            document.getElementById("systems").innerHTML = "";
            return;
        }

        renderSystems(data.systems);

    } catch (err) {
        console.log("خطا:", err);
        lastUpdateEl.innerText = "خطا در ارتباط با سرور";
    }
}

function formatPrice(num) {
    return Number(num || 0).toLocaleString("fa-IR");
}

function renderSystems(systemsObj) {
    const systemsDiv = document.getElementById("systems");
    systemsDiv.innerHTML = "";

    const systems = Object.values(systemsObj);

    const sorted = systems.sort((a, b) => {
        const numA = parseInt(a.name.match(/\d+/)?.[0] || "9999");
        const numB = parseInt(b.name.match(/\d+/)?.[0] || "9999");
        return numA - numB;
    });

    sorted.forEach(sys => {
        const card = document.createElement("div");
        card.className = "card " + (sys.active ? "active" : "free");

        card.innerHTML = `
            <h2>${sys.name}</h2>
            <p>وضعیت: ${sys.active ? "فعال" : "آزاد"}</p>
            <p>زمان: ${sys.elapsed}</p>
            <p>هزینه نهایی: ${formatPrice(sys.final_total)} تومان</p>
        `;

        card.onclick = () => openModalFull(sys);

        systemsDiv.appendChild(card);
    });
}

function renderSnacks(snacks) {
    if (!snacks || snacks.length === 0) {
        return "<p>بدون خوراکی</p>";
    }

    return snacks.map(sn => `
        <div class="snack-item">
            <span>${sn.name}</span>
            <span>${sn.qty} × ${formatPrice(sn.price)} تومان</span>
        </div>
    `).join("");
}

function renderCustomer(c) {
    if (!c) return "<p>بدون مشتری</p>";

    return `
        <div class="customer-box">
            <p>نام مشتری: ${c.name}</p>
            <p>کد: ${c.code}</p>
            <p>اعتبار: ${formatPrice(c.balance)} تومان</p>
        </div>
    `;
}

function openModalFull(sys) {
    const modal = document.getElementById("modal");
    const content = document.getElementById("modalContent");

    content.innerHTML = `
        <h2>${sys.name}</h2>

        <p>وضعیت: ${sys.active ? "فعال" : "آزاد"}</p>
        <p>زمان: ${sys.elapsed}</p>
        <p>هزینه زمان: ${formatPrice(sys.time_cost)} تومان</p>

        <h3>خوراکی‌ها:</h3>
        ${renderSnacks(sys.snacks)}

        <p class="modal-total-snacks">
            جمع خوراکی‌ها: ${formatPrice(sys.snacks_total)} تومان
        </p>

        <span class="modal-final-total">
            هزینه نهایی: ${formatPrice(sys.final_total)} تومان
        </span>

        <h3>مشتری:</h3>
        ${renderCustomer(sys.customer)}

        <p>یادداشت: ${sys.note || "—"}</p>
    `;

    modal.style.display = "block";
}

document.getElementById("closeModal").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

loadStatus();
setInterval(loadStatus, 5000);
</script>

</body>
</html>
