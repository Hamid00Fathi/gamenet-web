<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>داشبورد گیم‌نت</title>

    <style>
        body {
            font-family: B Nazanin, sans-serif;
            background: #121212;
            color: #eaeaea;
            margin: 0;
            padding: 15px;
            direction: rtl;
            font-size: 16px;
        }

        /* ============================
           منوی سه‌خط سمت راست
        ============================ */
        #menuButton {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #1e1e1e;
            color: #00eaff;
            font-size: 32px;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 0 10px #000;
        }

        #menuDropdown {
            position: fixed;
            top: 65px;
            right: 15px;
            background: #1e1e1e;
            width: 260px;
            border-radius: 12px;
            padding: 10px;
            display: none;
            z-index: 999999;
            box-shadow: 0 0 15px #000;
        }

        .menuItem {
            padding: 14px;
            font-size: 18px;
            color: #eaeaea;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        .menuItem:hover {
            background: #00eaff;
            color: black;
        }

        #menuDropdown hr {
            border: none;
            border-bottom: 1px solid #444;
            margin: 10px 0;
        }

        /* ============================
           حالت موبایل
        ============================ */
        @media (max-width: 1200px) {
            #menuButton {
                font-size: 60px;
                padding: 20px 30px;
                top: 25px;
                right: 25px;
            }

            #menuDropdown {
                top: 120px;
                right: 25px;
                width: 450px;
                padding: 25px;
            }

            .menuItem {
                font-size: 45px;
                padding: 30px;
            }
        }

        /* ============================
           داشبورد اصلی
        ============================ */
        #panelUsername {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00eaff;
        }

        #lastUpdate {
            font-size: 18px;
            margin-bottom: 20px;
            color: #cccccc;
        }

        #systems {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            cursor: pointer;
            font-size: 20px;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .active {
            border-right: 16px solid #00ff6a;
        }

        .free {
            border-right: 16px solid #ff3b3b;
        }

        .card h2 {
            margin: 0 0 10px 0;
            color: #00eaff;
            font-size: 24px;
        }

        @media (max-width: 1200px) {
            #systems {
                grid-template-columns: repeat(2, 1fr);
            }

            .card {
                font-size: 40px;
                padding: 25px;
            }

            .card h2 {
                font-size: 55px;
            }
        }

        #loading {
            text-align: center;
            margin-top: 80px;
            font-size: 22px;
            color: #00eaff;
        }

        /* ============================
           مودال
        ============================ */
        #modal {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: #000000dd;
            backdrop-filter: blur(5px);
            padding: 20px;
            overflow-y: auto;
            display: none;
            z-index: 999999;
        }

        #modalContent {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            max-width: 700px;
            margin: auto;
            font-size: 20px;
            line-height: 1.6;
        }

        #closeModal {
            background: #ff3b3b;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            font-size: 20px;
            display: block;
            width: 100%;
        }

        @media (max-width: 1200px) {
            #modalContent {
                max-width: 100%;
                font-size: 45px;
                padding: 30px;
            }

            #closeModal {
                font-size: 50px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<!-- دکمه سه‌خط -->
<div id="menuButton">≡</div>

<!-- منوی کشویی -->
<div id="menuDropdown">
    <div class="menuItem" id="menuUsername"></div>
    <div class="menuItem" id="menuExpire"></div>
    <div class="menuItem" id="menuDaysLeft"></div>

    <hr>

    <div class="menuItem" onclick="openSettings()">تنظیمات</div>
    <div class="menuItem" onclick="openReports()">گزارش‌ها</div>
    <div class="menuItem" onclick="openCustomers()">مشتری‌ها</div>
    <div class="menuItem" onclick="openSnacks()">خوراکی‌ها</div>

    <hr>

    <div class="menuItem" onclick="logout()">خروج</div>
</div>

<div id="loading">در حال بررسی اشتراک و دریافت اطلاعات...</div>

<div id="dashboard" style="display:none;">
    <div id="panelUsername"></div>
    <div id="lastUpdate"></div>

    <div id="systems"></div>
</div>

<!-- مودال -->
<div id="modal">
    <div id="modalContent">

        <button id="closeModal">بستن</button>

        <h2 id="modalTitle"></h2>

        <p><strong>وضعیت:</strong> <span id="modalStatus"></span></p>

        <div id="modalTimes"></div>

        <h3>خوراکی‌ها:</h3>
        <div id="modalSnacks"></div>

        <h3>مشتری:</h3>
        <div id="modalCustomer"></div>

        <h3>یادداشت:</h3>
        <div id="modalNote"></div>

    </div>
</div>

<script>
const BASE_URL = "https://gamenet-server-mongo.onrender.com";
const username = localStorage.getItem("username");

// جلوگیری از کرش toLocaleString
function safeNum(n) {
    return Number(n || 0).toLocaleString("fa-IR");
}

if (!username) {
    alert("ابتدا وارد حساب شوید");
    window.location.href = "login.html";
}

/* ============================
   منوی سه‌خط
============================ */
document.getElementById("menuButton").onclick = () => {
    const menu = document.getElementById("menuDropdown");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
};

async function loadSubscriptionInfo() {
    const res = await fetch(`${BASE_URL}/subscription/${username}`);
    const data = await res.json();

    document.getElementById("menuUsername").innerText = `کاربر: ${username}`;

    if (!data.expireDate) {
        document.getElementById("menuExpire").innerText = "اشتراک: ندارد";
        document.getElementById("menuDaysLeft").innerText = "";
        return;
    }

    document.getElementById("menuExpire").innerText = `پایان اشتراک: ${data.expireDate}`;

    const now = new Date();
    const exp = new Date(data.expireDate);
    const diff = exp - now;
    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

    document.getElementById("menuDaysLeft").innerText = `مانده: ${days} روز`;
}

/* ============================
   چک اشتراک
============================ */
async function checkSubscription(username) {
    const res = await fetch(`${BASE_URL}/subscription/${username}`);
    const data = await res.json();
    return data.active;
}

/* ============================
   گرفتن وضعیت
============================ */
async function loadStatus() {
    const res = await fetch(`${BASE_URL}/status/${username}`);
    return await res.json();
}

/* ============================
   رندر سیستم‌ها
============================ */
function renderSystems(systemsObj) {
    const systemsDiv = document.getElementById("systems");
    systemsDiv.innerHTML = "";

    Object.keys(systemsObj).forEach(key => {
        const sys = systemsObj[key];

        const card = document.createElement("div");
        card.className = "card";

        if (sys.active === 1 || sys.active === 2) card.classList.add("active");
        else card.classList.add("free");

        card.innerHTML = `
            <h2>${sys.name}</h2>
            <p>وضعیت: ${
                sys.active === 1 ? "فعال" :
                sys.active === 2 ? "مکث" :
                "آزاد"
            }</p>
            <p>زمان: ${sys.elapsed}</p>
            <p>هزینه نهایی: ${safeNum(sys.final_total)} تومان</p>
            <p>یادداشت: ${sys.note || "—"}</p>
        `;

        card.onclick = () => openModal(sys);

        systemsDiv.appendChild(card);
    });
}

/* ============================
   مودال
============================ */
function openModal(sys) {
    document.getElementById("modalTitle").innerText = sys.name;
    document.getElementById("modalStatus").innerText =
        sys.active === 1 ? "فعال" :
        sys.active === 2 ? "مکث" :
        "آزاد";

    document.getElementById("modalTimes").innerHTML = `
        <div class="customer-box">
            زمان سپری‌شده: ${sys.elapsed}
        </div>
        <div class="customer-box">
            هزینه زمان: ${safeNum(sys.time_cost)} تومان
        </div>
    `;

    const snacksDiv = document.getElementById("modalSnacks");
    snacksDiv.innerHTML = "";

    if (sys.snacks.length > 0) {
        sys.snacks.forEach(item => {
            const div = document.createElement("div");
            div.className = "snack-item";
            div.innerHTML = `
                <span>${item.name} × ${item.qty}</span>
                <span>${safeNum(item.price)} تومان</span>
            `;
            snacksDiv.appendChild(div);
        });
    } else {
        snacksDiv.innerHTML = "<div>خوراکی ثبت نشده</div>";
    }

    snacksDiv.innerHTML += `
        <div class="customer-box">
            جمع خوراکی‌ها: ${safeNum(sys.snacks_total)} تومان
        </div>
        <div class="customer-box">
            جمع نهایی: ${safeNum(sys.final_total)} تومان
        </div>
    `;

    const customerDiv = document.getElementById("modalCustomer");
    customerDiv.innerHTML = "";

    if (sys.customer) {
        customerDiv.innerHTML = `
            <div class="customer-box">
                <div>نام مشتری: ${sys.customer.name}</div>
                <div>کد: ${sys.customer.code}</div>
                <div>اعتبار: ${safeNum(sys.customer.balance)} تومان</div>
            </div>
        `;
    } else {
        customerDiv.innerHTML = "<div class='customer-box'>مشتری ثبت نشده</div>";
    }

    document.getElementById("modalNote").innerHTML = `
        <div class="customer-box">
            ${sys.note || "—"}
        </div>
    `;

    document.getElementById("modal").style.display = "block";
}

document.getElementById("closeModal").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

/* ============================
   اجرای اولیه + رفرش
============================ */
(async () => {
    const active = await checkSubscription(username);

    if (!active) {
        alert("اشتراک شما فعال نیست یا تمام شده است.");
        window.location.href = "login.html";
        return;
    }

    loadSubscriptionInfo();

    async function refresh() {
        const data = await loadStatus();
        if (!data) return;

        document.getElementById("panelUsername").innerText = `گیم‌نت: ${username}`;
        document.getElementById("lastUpdate").innerText =
            `آخرین بروزرسانی: ${data.lastUpdate}`;

        renderSystems(data.systems);

        document.getElementById("loading").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    }

    refresh();
    setInterval(refresh, 5000);
})();

/* ============================
   دکمه‌های منو
============================ */
function openSettings() {
    alert("بخش تنظیمات به‌زودی اضافه می‌شود");
}

function openReports() {
    alert("بخش گزارش‌ها به‌زودی اضافه می‌شود");
}

function openCustomers() {
    alert("بخش مدیریت مشتری‌ها به‌زودی اضافه می‌شود");
}

function openSnacks() {
    alert("بخش مدیریت خوراکی‌ها به‌زودی اضافه می‌شود");
}

function logout() {
    localStorage.removeItem("username");
    window.location.href = "login.html";
}
</script>

</body>
</html>
