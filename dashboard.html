<script>
const BASE_URL = "https://gamenet-server-mongo.onrender.com";
const username = localStorage.getItem("username");

// ایمن‌سازی عدد
function safeNum(n) {
    return Number(n || 0).toLocaleString("fa-IR");
}

if (!username) {
    alert("ابتدا وارد حساب شوید");
    window.location.href = "login.html";
}

// چک اشتراک
async function checkSubscription(username) {
    try {
        const res = await fetch(`${BASE_URL}/subscription/${username}`);
        const data = await res.json();
        return data.active;
    } catch {
        return false;
    }
}

// گرفتن وضعیت
async function loadStatus() {
    try {
        const res = await fetch(`${BASE_URL}/status/${username}`);
        return await res.json();
    } catch (e) {
        console.log("خطا در loadStatus:", e);
        return null;
    }
}

// رندر سیستم‌ها
function renderSystems(systemsObj) {
    const systemsDiv = document.getElementById("systems");
    systemsDiv.innerHTML = "";

    Object.keys(systemsObj).forEach(key => {
        const sys = systemsObj[key];

        const card = document.createElement("div");
        card.className = "card";

        if (sys.active === 1 || sys.active === 2) card.classList.add("active");
        else card.classList.add("free");

        card.innerHTML = `
            <h2>${sys.name}</h2>
            <p>وضعیت: ${
                sys.active === 1 ? "فعال" :
                sys.active === 2 ? "مکث" :
                "آزاد"
            }</p>
            <p>زمان: ${sys.elapsed}</p>
            <p>هزینه نهایی: ${safeNum(sys.final_total)} تومان</p>
            <p>یادداشت: ${sys.note || "—"}</p>
        `;

        card.onclick = () => openModal(sys);

        systemsDiv.appendChild(card);
    });
}

// مودال
function openModal(sys) {
    document.getElementById("modalTitle").innerText = sys.name;
    document.getElementById("modalStatus").innerText =
        sys.active === 1 ? "فعال" :
        sys.active === 2 ? "مکث" :
        "آزاد";

    document.getElementById("modalTimes").innerHTML = `
        <div class="customer-box">
            زمان سپری‌شده: ${sys.elapsed}
        </div>
        <div class="customer-box">
            هزینه زمان: ${safeNum(sys.time_cost)} تومان
        </div>
    `;

    const snacksDiv = document.getElementById("modalSnacks");
    snacksDiv.innerHTML = "";

    if (sys.snacks.length > 0) {
        sys.snacks.forEach(item => {
            const div = document.createElement("div");
            div.className = "snack-item";
            div.innerHTML = `
                <span>${item.name} × ${item.qty}</span>
                <span>${safeNum(item.price)} تومان</span>
            `;
            snacksDiv.appendChild(div);
        });
    } else {
        snacksDiv.innerHTML = "<div>خوراکی ثبت نشده</div>";
    }

    snacksDiv.innerHTML += `
        <div class="customer-box">
            جمع خوراکی‌ها: ${safeNum(sys.snacks_total)} تومان
        </div>
        <div class="customer-box">
            جمع نهایی: ${safeNum(sys.final_total)} تومان
        </div>
    `;

    const customerDiv = document.getElementById("modalCustomer");
    customerDiv.innerHTML = "";

    if (sys.customer) {
        customerDiv.innerHTML = `
            <div class="customer-box">
                <div>نام مشتری: ${sys.customer.name}</div>
                <div>کد: ${sys.customer.code}</div>
                <div>اعتبار: ${safeNum(sys.customer.balance)} تومان</div>
            </div>
        `;
    } else {
        customerDiv.innerHTML = "<div class='customer-box'>مشتری ثبت نشده</div>";
    }

    document.getElementById("modalNote").innerHTML = `
        <div class="customer-box">
            ${sys.note || "—"}
        </div>
    `;

    document.getElementById("modal").style.display = "block";
}

document.getElementById("closeModal").onclick = () => {
    document.getElementById("modal").style.display = "none";
};

// اجرای اولیه + آپدیت هر ۵ ثانیه
(async () => {
    const active = await checkSubscription(username);

    if (!active) {
        alert("اشتراک شما فعال نیست یا تمام شده است.");
        window.location.href = "login.html";
        return;
    }

    async function refresh() {
        const data = await loadStatus();
        if (!data) return;

        document.getElementById("panelUsername").innerText = `گیم‌نت: ${username}`;
        document.getElementById("lastUpdate").innerText =
            `آخرین بروزرسانی: ${data.lastUpdate}`;

        renderSystems(data.systems);

        document.getElementById("loading").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    }

    refresh();
    setInterval(refresh, 5000);
})();
</script>
