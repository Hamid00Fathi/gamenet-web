<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت گیم‌نت</title>

    <style>
        body {
            font-family: B Nazanin, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        #panelUsername {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #lastUpdate {
            font-size: 18px;
            margin-bottom: 20px;
        }

        #systems {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .active {
            border-right: 5px solid #28a745;
        }

        .free {
            border-right: 5px solid #dc3545;
        }

        .card h2 {
            margin: 0 0 10px 0;
        }

        .snack-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .customer-box {
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            body {
                font-size: 18px;
            }

            .card h2 {
                font-size: 22px;
            }

            .card p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <p id="panelUsername"></p>
    <p id="lastUpdate"></p>

    <div id="systems"></div>

    <script src="app.js"></script>
</body>
</html>
