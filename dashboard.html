<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>داشبورد گیم‌نت</title>

  <style>
    body {
      font-family: B Nazanin, sans-serif;
      background: #121212;
      color: #eaeaea;
      margin: 0;
      padding: 0;
      direction: rtl;
    }

    #container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
    }

    /* منوی سه‌خط */
    #menuButton {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #1e1e1e;
      color: #00eaff;
      font-size: 40px;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      z-index: 999999;
      box-shadow: 0 0 10px #000;
    }

    #menuDropdown {
      position: fixed;
      top: 80px;
      right: 15px;
      background: #1e1e1e;
      width: 300px;
      border-radius: 15px;
      padding: 15px;
      display: none;
      z-index: 999999;
      box-shadow: 0 0 15px #000;
    }

    .menuItem {
      padding: 18px;
      font-size: 20px;
      color: #eaeaea;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    .menuItem:hover {
      background: #00eaff;
      color: black;
    }

    #menuSubscriptionBox {
      background:#252525;
      padding:15px;
      border-radius:12px;
      margin-bottom:10px;
      box-shadow:0 0 10px #000;
      font-size:18px;
      color:#00eaff;
    }

    /* داشبورد */
    #dashboard {
      margin-top: 100px;
    }

    #panelUsername {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #00eaff;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 10px #000;
    }

    #lastUpdate {
      font-size: 20px;
      margin-bottom: 20px;
      color: #cccccc;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 10px #000;
    }

    /* اشتراک فعلی */
    #subscriptionInfo {
      background:#1e1e1e;
      padding:15px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 0 10px #000;
      font-size:18px;
    }

    #subscriptionInfo p {
      margin:5px 0;
    }

    /* اشتراک منقضی شده */
    #subscriptionExpired {
      display:none;
      background:#1e1e1e;
      padding:35px;
      border-radius:15px;
      margin-bottom:25px;
      text-align:center;
      box-shadow:0 0 15px #000;
    }

    #subscriptionExpired h2 {
      color:#ff4444;
      font-size:32px;
      margin-bottom:15px;
    }

    #subscriptionExpired p {
      font-size:22px;
      margin:10px 0;
    }

    #subscriptionExpired .phone {
      font-size:28px;
      color:#00eaff;
      font-weight:bold;
    }

    /* سیستم‌ها */
    #systems {
      display:grid;
      grid-template-columns: repeat(4,1fr);
      gap:15px;
    }

    .card {
      background:#1e1e1e;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,255,255,0.15);
      transition:0.3s;
      cursor:pointer;
      font-size:20px;
      border:1px solid #00eaff33;
    }

    .card:hover {
      transform:translateY(-5px);
      box-shadow:0 0 25px rgba(0,255,255,0.25);
    }

    .active {
      border-right:12px solid #00ff6a;
    }

    .free {
      border-right:12px solid #ff3b3b;
    }

    .card h2 {
      margin:0 0 10px 0;
      color:#00eaff;
      font-size:26px;
    }

    /* مودال */
    #modal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.8);
      padding:20px;
      overflow-y:auto;
      z-index:999999;
    }

    #modalContent {
      background:#222;
      padding:25px;
      border-radius:20px;
      color:#fff;
      font-size:22px;
      line-height:1.8;
    }

    #closeModal {
      margin-top:20px;
      padding:12px 25px;
      font-size:20px;
      background: #ff4444;
      color:#fff;
      border:none;
      border-radius:10px;
    }

    /* نسخه موبایل */
    @media (max-width: 1200px) {
      #systems {
        grid-template-columns: repeat(2,1fr);
      }
    }
  </style>
</head>

<body>

<div id="menuButton">☰</div>

<div id="menuDropdown">
  <div id="menuSubscriptionBox">
    <div id="menuSubExpire"></div>
    <div id="menuSubDaysLeft"></div>
  </div>

  <div class="menuItem">مشتری‌ها</div>
  <div class="menuItem">خوراکی‌ها</div>
  <div class="menuItem">گزارش‌ها</div>
  <div class="menuItem">تنظیمات</div>
  <hr>
  <div class="menuItem" onclick="logout()">خروج</div>
</div>

<div id="container">

<div id="dashboard">

  <div id="panelUsername"></div>
  <div id="lastUpdate"></div>

  <!-- اشتراک فعلی -->
  <div id="subscriptionInfo">
    <p id="subExpire"></p>
    <p id="subDaysLeft"></p>
  </div>

  <!-- اشتراک منقضی شده -->
  <div id="subscriptionExpired">
    <h2>اشتراک شما فعال نیست</h2>
    <p>برای استفاده از پنل باید اشتراک تهیه کنید.</p>
    <p class="phone">09187343793</p>
  </div>

  <!-- سیستم‌ها -->
  <div id="systems"></div>

</div>

</div>

<!-- مودال -->
<div id="modal">
  <div id="modalContent"></div>
  <button id="closeModal">بستن</button>
</div>

<script>
const BASE_URL = "https://gamenet-server-mongo.onrender.com";
const username = localStorage.getItem("username");

/* منوی سه‌خط */
document.getElementById("menuButton").onclick = () => {
  const menu = document.getElementById("menuDropdown");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

/* محاسبه روزهای مانده */
function calcDaysLeft(expireDate) {
  const today = new Date();
  const exp = new Date(expireDate);
  const diff = exp - today;
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

/* اطلاعات اشتراک — نسخه سالم قبلی */
async function loadSubscriptionInfo() {
  const res = await fetch(`${BASE_URL}/subscription/${username}`);
  const data = await res.json();

  const expire = data.expireDate || "—";
  const daysLeft = data.active ? calcDaysLeft(expire) : 0;

  document.getElementById("subExpire").innerText =
    `تاریخ پایان اشتراک: ${expire}`;

  document.getElementById("subDaysLeft").innerText =
    data.active
      ? `روزهای مانده: ${daysLeft} روز`
      : `اشتراک شما فعال نیست`;

  document.getElementById("menuSubExpire").innerText =
    `پایان اشتراک: ${expire}`;

  document.getElementById("menuSubDaysLeft").innerText =
    data.active
      ? `مانده: ${daysLeft} روز`
      : `غیرفعال`;
}

/* چک اشتراک — نسخه سالم قبلی */
async function checkSubscription(username) {
  const res = await fetch(`${BASE_URL}/subscription/${username}`);
  const data = await res.json();
  return data.active;
}

/* گرفتن وضعیت */
async function loadStatus() {
  const res = await fetch(`${BASE_URL}/status/${username}`);
  return await res.json();
}

/* رندر سیستم‌ها */
function renderSystems(systemsObj) {
  const systemsDiv = document.getElementById("systems");
  systemsDiv.innerHTML = "";

  Object.keys(systemsObj).forEach(key => {
    const sys = systemsObj[key];

    const card = document.createElement("div");
    card.className = "card";

    if (sys.active === 1 || sys.active === 2) card.classList.add("active");
    else card.classList.add("free");

    card.innerHTML = `
      <h2>${sys.name}</h2>
      <p>وضعیت: ${
        sys.active === 1 ? "فعال" :
        sys.active === 2 ? "مکث" :
        "آزاد"
      }</p>
      <p>زمان: ${sys.elapsed}</p>
      <p>هزینه نهایی: ${safeNum(sys.final_total)} تومان</p>
      <p>یادداشت: ${sys.note || "—"}</p>
    `;

    card.onclick = () => openModal(sys);

    systemsDiv.appendChild(card);
  });
}

/* مودال */
function openModal(sys) {
  const modal = document.getElementById("modal");
  const content = document.getElementById("modalContent");

  content.innerHTML = `
    <h2>${sys.name}</h2>
    <div class="customer-box">وضعیت: ${
      sys.active === 1 ? "فعال" :
      sys.active === 2 ? "مکث" :
      "آزاد"
    }</div>

    <div class="customer-box">زمان سپری‌شده: ${sys.elapsed}</div>
    <div class="customer-box">هزینه زمان: ${safeNum(sys.time_cost)} تومان</div>

    <h3>خوراکی‌ها:</h3>
  `;

  const snacksDiv = document.createElement("div");

  if (sys.snacks && sys.snacks.length > 0) {
    sys.snacks.forEach(item => {
      const div = document.createElement("div");
      div.className = "snack-item";
      div.innerHTML = `
        <span>${item.name} × ${item.qty}</span>
        <span>${safeNum(item.price)} تومان</span>
      `;
      snacksDiv.appendChild(div);
    });
  } else {
    snacksDiv.innerHTML = "<div>خوراکی ثبت نشده</div>";
  }

  content.appendChild(snacksDiv);

  content.innerHTML += `
    <div class="customer-box">جمع خوراکی‌ها: ${safeNum(sys.snacks_total)} تومان</div>
    <div class="customer-box">جمع نهایی: ${safeNum(sys.final_total)} تومان</div>
  `;

  const customerDiv = document.createElement("div");

  if (sys.customer) {
    customerDiv.innerHTML = `
      <div class="customer-box">
        <div>نام مشتری: ${sys.customer.name}</div>
        <div>کد: ${sys.customer.code}</div>
        <div>اعتبار: ${safeNum(sys.customer.balance)} تومان</div>
      </div>
    `;
  } else {
    customerDiv.innerHTML = "<div class='customer-box'>مشتری ثبت نشده</div>";
  }

  content.appendChild(customerDiv);

  content.innerHTML += `
    <div class="customer-box">${sys.note || "—"}</div>
  `;

  modal.style.display = "block";
}

document.getElementById("closeModal").onclick = () => {
  document.getElementById("modal").style.display = "none";
};

/* اجرای اولیه + رفرش */
(async () => {
  const active = await checkSubscription(username);

  loadSubscriptionInfo();

  if (!active) {
    document.getElementById("subscriptionExpired").style.display = "block";
    document.getElementById("systems").innerHTML = "";
    return;
  }

  async function refresh() {
    const data = await loadStatus();
    if (!data) return;

    document.getElementById("panelUsername").innerText = `گیم‌نت: ${username}`;
    document.getElementById("lastUpdate").innerText =
      `آخرین بروزرسانی: ${data.lastUpdate}`;

    renderSystems(data.systems);
  }

  refresh();
  setInterval(refresh, 5000);
})();

/* خروج */
function logout() {
  localStorage.removeItem("username");
  localStorage.removeItem("password");
  window.location.href = "login.html";
}

/* تابع امن عدد */
function safeNum(n) {
  return Number(n || 0).toLocaleString("fa-IR");
}
</script>

</body>
</html>
