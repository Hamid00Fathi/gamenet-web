<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ورود به پنل گیم‌نت</title>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      text-align: center;
      margin-top: 80px;
      background: #121212;
      color: #eaeaea;
    }

    .box {
      display: inline-block;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      min-width: 280px;
    }

    h2 {
      margin-bottom: 20px;
      color: #00eaff;
    }

    input {
      padding: 10px;
      width: 250px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #2a2a2a;
      color: #eaeaea;
    }

    input::placeholder {
      color: #bbbbbb;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      margin: 5px;
    }

    #loginBtn {
      background: #4caf50;
      color: white;
    }

    #registerBtn {
      background: #2196f3;
      color: white;
      opacity: 0.5;
      pointer-events: none;
    }

    #registerBtn.active {
      opacity: 1;
      pointer-events: auto;
    }

    #error {
      color: #ff6b6b;
      margin-top: 10px;
      min-height: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>ورود به پنل گیم‌نت</h2>

    <input id="username" type="text" placeholder="یوزرنیم گیم‌نت">
    <br>
    <input id="password" type="password" placeholder="پسورد گیم‌نت">
    <br>

    <button id="loginBtn">ورود</button>
    <button id="registerBtn">ثبت‌نام</button>

    <p id="error"></p>
  </div>

  <script>
    const BASE_URL = "https://gamenet-server-mongo.onrender.com";

    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");
    const errorEl = document.getElementById("error");

    // تابع چک اشتراک از سرور
    async function checkSubscription(username) {
      const res = await fetch(`${BASE_URL}/subscription/${username}`);
      const data = await res.json();
      return data.active; // اگر true باشد یعنی اشتراک فعال است
    }

    // دکمه ورود
    loginBtn.onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      errorEl.textContent = "";

      if (!username || !password) {
        errorEl.textContent = "یوزرنیم و پسورد را وارد کنید.";
        return;
      }

      // قدم ۱: چک وجود داشتن کاربر
      try {
        const checkRes = await fetch(`${BASE_URL}/check/${username}`);
        const checkData = await checkRes.json();

        if (!checkData.exists) {
          errorEl.textContent = "این یوزرنیم وجود ندارد. برای ساخت حساب روی ثبت‌نام کلیک کنید.";
          registerBtn.classList.add("active");
          return;
        }
      } catch (e) {
        errorEl.textContent = "خطا در ارتباط با سرور (check).";
        return;
      }

      // قدم ۲: چک اشتراک
      let isActive = false;
      try {
        isActive = await checkSubscription(username);
      } catch (e) {
        errorEl.textContent = "خطا در ارتباط با سرور (subscription).";
        return;
      }

      if (!isActive) {
        errorEl.textContent = "اشتراک شما فعال نیست یا تمام شده است.";
        return; // اجازه ورود نمی‌دهیم
      }

      // قدم ۳: تلاش برای ورود (چک پسورد)
      try {
        const loginTry = await fetch(`${BASE_URL}/status/${username}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            systems: {},
            lastUpdate: new Date().toISOString()
          })
        });

        const loginData = await loginTry.json();

        if (loginData.error === "Wrong password") {
          errorEl.textContent = "پسورد اشتباه است.";
          return;
        }

        // قدم ۴: ورود موفق
        localStorage.setItem("username", username);
        localStorage.setItem("password", password);
        window.location.href = "dashboard.html";
      } catch (e) {
        errorEl.textContent = "خطا در ارتباط با سرور (login).";
      }
    };

    // دکمه ثبت‌نام
    registerBtn.onclick = async () => {
      if (!registerBtn.classList.contains("active")) return;

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        errorEl.textContent = "برای ثبت‌نام، یوزرنیم و پسورد را وارد کنید.";
        return;
      }

      try {
        const res = await fetch(`${BASE_URL}/status/${username}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            systems: {},
            lastUpdate: new Date().toISOString()
          })
        });

        const data = await res.json();

        if (data.ok) {
          localStorage.setItem("username", username);
          localStorage.setItem("password", password);
          window.location.href = "dashboard.html";
        } else {
          errorEl.textContent = "خطا در ثبت‌نام.";
        }
      } catch (e) {
        errorEl.textContent = "خطا در ارتباط با سرور (register).";
      }
    };
  </script>

</body>
</html>
