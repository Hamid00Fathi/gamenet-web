<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ورود به پنل گیم‌نت</title>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      text-align: center;
      margin-top: 80px;
      background: #121212;
      color: #eaeaea;
    }

    .box {
      display: inline-block;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      min-width: 300px;
    }

    h2 {
      margin-bottom: 20px;
      color: #00eaff;
    }

    input {
      padding: 10px;
      width: 260px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #2a2a2a;
      color: #eaeaea;
    }

    input::placeholder {
      color: #bbbbbb;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      margin: 5px;
      transition: 0.2s;
    }

    #loginBtn {
      background: #4caf50;
      color: white;
    }

    #registerBtn {
      background: #2196f3;
      color: white;
    }

    #error {
      color: #ff6b6b;
      margin-top: 10px;
      min-height: 20px;
      font-size: 14px;
    }

    /* لودینگ */
    #loading {
      display: none;
      margin-top: 15px;
      font-size: 16px;
      color: #00eaff;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #00eaff;
      border-top-color: transparent;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>ورود / ثبت‌نام</h2>

    <input id="username" type="text" placeholder="یوزرنیم گیم‌نت">
    <br>
    <input id="password" type="password" placeholder="پسورد گیم‌نت">
    <br>
    <input id="confirmPassword" type="password" placeholder="تایید پسورد (برای ثبت‌نام)">
    <br>

    <button id="loginBtn">ورود</button>
    <button id="registerBtn">ثبت‌نام</button>

    <div id="loading">
      <div class="spinner"></div>
      <p>در حال انجام عملیات...</p>
    </div>

    <p id="error"></p>
  </div>

  <script>
    const BASE_URL = "https://gamenet-server-mongo.onrender.com";

    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");
    const errorEl = document.getElementById("error");
    const loadingEl = document.getElementById("loading");

    function showLoading() {
      loadingEl.style.display = "block";
      loginBtn.disabled = true;
      registerBtn.disabled = true;
    }

    function hideLoading() {
      loadingEl.style.display = "none";
      loginBtn.disabled = false;
      registerBtn.disabled = false;
    }

    async function checkSubscription(username) {
      const res = await fetch(`${BASE_URL}/subscription/${username}`);
      const data = await res.json();
      return data.active;
    }

    // ============================
    // ورود
    // ============================
    loginBtn.onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      errorEl.textContent = "";

      if (!username || !password) {
        errorEl.textContent = "یوزرنیم و پسورد را وارد کنید.";
        return;
      }

      showLoading();

      try {
        const checkRes = await fetch(`${BASE_URL}/check/${username}`);
        const checkData = await checkRes.json();

        if (!checkData.exists) {
          hideLoading();
          errorEl.textContent = "این یوزرنیم وجود ندارد. برای ساخت حساب روی ثبت‌نام کلیک کنید.";
          return;
        }
      } catch {
        hideLoading();
        errorEl.textContent = "خطا در ارتباط با سرور (check).";
        return;
      }

      let isActive = false;
      try {
        isActive = await checkSubscription(username);
      } catch {
        hideLoading();
        errorEl.textContent = "خطا در ارتباط با سرور (subscription).";
        return;
      }

      if (!isActive) {
        hideLoading();
        errorEl.textContent = "اشتراک شما فعال نیست یا تمام شده است.";
        return;
      }

      try {
        const loginTry = await fetch(`${BASE_URL}/status/${username}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            systems: {},
            lastUpdate: new Date().toISOString()
          })
        });

        const loginData = await loginTry.json();

        if (loginData.error === "Wrong password") {
          hideLoading();
          errorEl.textContent = "پسورد اشتباه است.";
          return;
        }

        localStorage.setItem("username", username);
        localStorage.setItem("password", password);

        window.location.href = "dashboard.html";
      } catch {
        hideLoading();
        errorEl.textContent = "خطا در ارتباط با سرور (login).";
      }
    };

    // ============================
    // ثبت‌نام
    // ============================
    registerBtn.onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      errorEl.textContent = "";

      if (!username || !password || !confirmPassword) {
        errorEl.textContent = "تمام فیلدها را وارد کنید.";
        return;
      }

      if (password !== confirmPassword) {
        errorEl.textContent = "پسورد و تایید پسورد یکسان نیستند.";
        return;
      }

      showLoading();

      try {
        const res = await fetch(`${BASE_URL}/status/${username}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            systems: {},
            lastUpdate: new Date().toISOString()
          })
        });

        const data = await res.json();

        if (data.ok) {
          localStorage.setItem("username", username);
          localStorage.setItem("password", password);
          window.location.href = "dashboard.html";
        } else {
          errorEl.textContent = "خطا در ثبت‌نام.";
        }
      } catch {
        errorEl.textContent = "خطا در ارتباط با سرور (register).";
      }

      hideLoading();
    };
  </script>

</body>
</html>
