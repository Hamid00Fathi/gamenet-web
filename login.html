<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ورود به پنل گیم‌نت</title>
  <style>
    body { font-family: sans-serif; direction: rtl; text-align: center; margin-top: 80px; }
    input { padding: 10px; width: 250px; margin: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>ورود به پنل گیم‌نت</h2>

  <input id="username" placeholder="یوزرنیم گیم‌نت">
  <br>
  <input id="password" placeholder="پسورد گیم‌نت" type="password">
  <br>
  <button onclick="login()">ورود</button>

  <p id="error" style="color:red;"></p>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorEl = document.getElementById("error");

      if (!username || !password) {
        errorEl.textContent = "یوزرنیم و پسورد را وارد کنید.";
        return;
      }

      // ذخیره در مرورگر
      localStorage.setItem("username", username);
      localStorage.setItem("password", password);

      // انتقال به داشبورد
      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
