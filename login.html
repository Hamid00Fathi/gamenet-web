<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ورود به پنل گیم‌نت</title>
  <style>
    body { font-family: sans-serif; direction: rtl; text-align: center; margin-top: 80px; }
    input { padding: 10px; width: 250px; margin: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>ورود به پنل گیم‌نت</h2>

  <form id="loginForm">
    <input id="username" type="text" placeholder="یوزرنیم گیم‌نت">
    <br>
    <input id="password" type="password" placeholder="پسورد گیم‌نت">
    <br>
    <button type="submit">ورود</button>
  </form>

  <p id="error" style="color:red;"></p>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault(); // جلوگیری از رفتار عجیب روی گوشی

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorEl = document.getElementById("error");

      if (!username || !password) {
        errorEl.textContent = "یوزرنیم و پسورد را وارد کنید.";
        return;
      }

      // ذخیره در مرورگر (روی گوشی ۱۰۰٪ کار می‌کند)
      localStorage.setItem("username", username);
      localStorage.setItem("password", password);

      // انتقال به داشبورد
      window.location.href = "dashboard.html?v=2";
    });
  </script>

</body>
</html>
