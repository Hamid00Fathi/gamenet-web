<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ورود به پنل گیم‌نت</title>

  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      text-align: center;
      margin-top: 80px;
      background: #121212;
      color: #eaeaea;
    }

    .box {
      display: inline-block;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      min-width: 300px;
    }

    h2 {
      margin-bottom: 20px;
      color: #00eaff;
    }

    input {
      padding: 10px;
      width: 260px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #2a2a2a;
      color: #eaeaea;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      margin: 5px;
    }

    #loginBtn {
      background: #4caf50;
      color: white;
    }

    #goRegister {
      background: #2196f3;
      color: white;
    }

    #error {
      color: #ff6b6b;
      margin-top: 10px;
      min-height: 20px;
      font-size: 14px;
    }

    /* لودینگ */
    #loading {
      display: none;
      margin-top: 15px;
      font-size: 16px;
      color: #00eaff;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #00eaff;
      border-top-color: transparent;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>ورود به پنل گیم‌نت</h2>

    <input id="username" type="text" placeholder="یوزرنیم">
    <br>
    <input id="password" type="password" placeholder="پسورد">
    <br>

    <button id="loginBtn">ورود</button>
    <button id="goRegister">ثبت‌نام</button>

    <div id="loading">
      <div class="spinner"></div>
      <p>در حال انجام عملیات...</p>
    </div>

    <p id="error"></p>
  </div>

  <script>
    const BASE_URL = "https://gamenet-server-mongo.onrender.com";

    const loginBtn = document.getElementById("loginBtn");
    const goRegister = document.getElementById("goRegister");
    const errorEl = document.getElementById("error");
    const loadingEl = document.getElementById("loading");

    function showLoading() {
      loadingEl.style.display = "block";
      loginBtn.disabled = true;
      goRegister.disabled = true;
    }

    function hideLoading() {
      loadingEl.style.display = "none";
      loginBtn.disabled = false;
      goRegister.disabled = false;
    }

    async function checkSubscription(username) {
      const res = await fetch(`${BASE_URL}/subscription/${username}`);
      const data = await res.json();
      return data.active;
    }

    loginBtn.onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      errorEl.textContent = "";

      if (!username || !password) {
        errorEl.textContent = "یوزرنیم و پسورد را وارد کنید.";
        return;
      }

      showLoading();

      try {
        const checkRes = await fetch(`${BASE_URL}/check/${username}`);
        const checkData = await checkRes.json();

        if (!checkData.exists) {
          hideLoading();
          errorEl.textContent = "این یوزرنیم وجود ندارد.";
          return;
        }
      } catch {
        hideLoading();
        errorEl.textContent = "خطا در ارتباط با سرور.";
        return;
      }

      let isActive = false;
      try {
        isActive = await checkSubscription(username);
      } catch {
        hideLoading();
        errorEl.textContent = "خطا در ارتباط با سرور.";
        return;
      }

      if (!isActive) {
        hideLoading();
        errorEl.textContent = "اشتراک شما فعال نیست.";
        return;
      }

      try {
        const loginTry = await fetch(`${BASE_URL}/status/${username}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            systems: {},
            lastUpdate: new Date().toISOString()
          })
        });

        const loginData = await loginTry.json();

        if (loginData.error === "Wrong password") {
          hideLoading();
          errorEl.textContent = "پسورد اشتباه است.";
          return;
        }

        localStorage.setItem("username", username);
        localStorage.setItem("password", password);

        window.location.href = "dashboard.html";
      } catch {
        hideLoading();
        errorEl.textContent = "خطا در ارتباط با سرور.";
      }
    };

    goRegister.onclick = () => {
      window.location.href = "register.html";
    };
  </script>

</body>
</html>
